[project]
name = "capwizard"
version = "0.1.0"
description = "CapWizard engine: builds CapCut drafts from raw videos (transcription, AI edit, template-cloned subtitles). Basis for the CapWizard MCP server."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "rapidfuzz>=3.6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.39.0"]

[project.scripts]
capwizard = "capwizard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
